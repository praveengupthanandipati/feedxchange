<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" fill="none" role="img" aria-label="Network of mills, traders and transporters">
  <defs>
    <radialGradient id="a-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1b4a85" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1b4a85" stop-opacity="0"/>
    </radialGradient>
    <filter id="a-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#071a33" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="520" height="420" rx="28" fill="#f4f8fd"/>
  <circle cx="260" cy="210" r="190" fill="url(#a-glow)"/>

  <!-- Links -->
  <g stroke="#1b4a85" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8">
    <path d="M260 210L120 110M260 210L400 100M260 210L110 310M260 210L410 320M260 210L260 60"/>
  </g>

  <!-- Hub -->
  <g filter="url(#a-shadow)">
    <circle cx="260" cy="210" r="58" fill="#0b2547"/>
  </g>
  <path d="M242 228v-36h26M242 210h18" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M266 210l14 18M280 210l-14 18" stroke="#f5a524" stroke-width="7" stroke-linecap="round"/>

  <!-- Nodes -->
  <g filter="url(#a-shadow)">
    <circle cx="120" cy="110" r="34" fill="#fff"/>
    <circle cx="400" cy="100" r="34" fill="#fff"/>
    <circle cx="110" cy="310" r="34" fill="#fff"/>
    <circle cx="410" cy="320" r="34" fill="#fff"/>
    <circle cx="260" cy="60" r="26" fill="#fff"/>
  </g>
  <!-- Mill -->
  <path d="M104 124v-18l10-8v8l10-8v8l10-8v26z" fill="#1b4a85"/>
  <!-- Trader -->
  <circle cx="400" cy="92" r="8" fill="#e08c0b"/>
  <path d="M384 118c2-10 8-14 16-14s14 4 16 14" stroke="#e08c0b" stroke-width="5" stroke-linecap="round"/>
  <!-- Truck -->
  <path d="M92 318v-16h22v16M114 306h8l6 6v6h-14" stroke="#22a06b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100" cy="321" r="3.5" fill="#22a06b"/>
  <circle cx="122" cy="321" r="3.5" fill="#22a06b"/>
  <!-- Warehouse -->
  <path d="M392 336v-18l18-12 18 12v18z" stroke="#1b4a85" stroke-width="4" stroke-linejoin="round"/>
  <path d="M404 336v-10h12v10" stroke="#1b4a85" stroke-width="4"/>
  <!-- Rupee -->
  <path d="M252 50h16M252 57h16M256 50c8 0 8 14 0 14l10 10" stroke="#f5a524" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
