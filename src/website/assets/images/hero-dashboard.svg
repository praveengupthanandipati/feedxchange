<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" fill="none" role="img" aria-label="FeedXchange trading dashboard">
  <defs>
    <linearGradient id="h-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f4f8fd"/>
    </linearGradient>
    <linearGradient id="h-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5a524" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f5a524" stop-opacity="0"/>
    </linearGradient>
    <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#071a33" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Main window -->
  <g filter="url(#h-shadow)">
    <rect x="30" y="40" width="440" height="320" rx="20" fill="url(#h-card)"/>
  </g>
  <rect x="30" y="40" width="440" height="48" rx="20" fill="#0b2547"/>
  <rect x="30" y="68" width="440" height="20" fill="#0b2547"/>
  <circle cx="58" cy="64" r="6" fill="#f46a6a"/>
  <circle cx="78" cy="64" r="6" fill="#f5a524"/>
  <circle cx="98" cy="64" r="6" fill="#22a06b"/>
  <rect x="300" y="57" width="150" height="14" rx="7" fill="#1b4a85"/>

  <!-- KPI tiles -->
  <rect x="54" y="108" width="122" height="64" rx="12" fill="#e8f1fb"/>
  <rect x="68" y="122" width="60" height="8" rx="4" fill="#6b7a90" opacity=".5"/>
  <rect x="68" y="140" width="80" height="16" rx="5" fill="#0b2547"/>
  <rect x="190" y="108" width="122" height="64" rx="12" fill="#e8f1fb"/>
  <rect x="204" y="122" width="60" height="8" rx="4" fill="#6b7a90" opacity=".5"/>
  <rect x="204" y="140" width="64" height="16" rx="5" fill="#0b2547"/>
  <rect x="326" y="108" width="122" height="64" rx="12" fill="#fff4e0"/>
  <rect x="340" y="122" width="60" height="8" rx="4" fill="#6b7a90" opacity=".5"/>
  <rect x="340" y="140" width="72" height="16" rx="5" fill="#e08c0b"/>

  <!-- Price chart -->
  <rect x="54" y="190" width="394" height="148" rx="14" fill="#ffffff" stroke="#e3e9f1"/>
  <path d="M74 300 L74 240 L120 255 L166 225 L212 238 L258 205 L304 218 L350 190 L396 200 L428 186 L428 318 L74 318 Z" fill="url(#h-area)" transform="translate(0 4)"/>
  <path d="M74 244 L120 259 L166 229 L212 242 L258 209 L304 222 L350 194 L396 204 L428 190" stroke="#f5a524" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#e3e9f1" stroke-width="1">
    <path d="M74 260H428M74 290H428"/>
  </g>
  <circle cx="350" cy="194" r="7" fill="#fff" stroke="#f5a524" stroke-width="4"/>

  <!-- Floating truck card -->
  <g filter="url(#h-shadow)">
    <rect x="330" y="300" width="200" height="96" rx="16" fill="#ffffff"/>
  </g>
  <rect x="348" y="318" width="40" height="40" rx="10" fill="#e8f1fb"/>
  <path d="M358 344v-12h12v12M370 336h6l4 4v4h-10" stroke="#1b4a85" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="400" y="322" width="90" height="9" rx="4.5" fill="#0b2547"/>
  <rect x="400" y="340" width="64" height="8" rx="4" fill="#6b7a90" opacity=".45"/>
  <rect x="348" y="372" width="164" height="8" rx="4" fill="#e3e9f1"/>
  <rect x="348" y="372" width="112" height="8" rx="4" fill="#22a06b"/>

  <!-- Floating contract badge -->
  <g filter="url(#h-shadow)">
    <rect x="0" y="250" width="150" height="70" rx="16" fill="#ffffff"/>
  </g>
  <circle cx="34" cy="285" r="16" fill="#22a06b" opacity=".15"/>
  <path d="M27 285l5 5 10-10" stroke="#22a06b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="60" y="273" width="70" height="9" rx="4.5" fill="#0b2547"/>
  <rect x="60" y="290" width="50" height="8" rx="4" fill="#6b7a90" opacity=".45"/>
</svg>
