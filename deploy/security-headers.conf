# Security headers for every response of the site (nginx). Included in the server block AND in every location that has
# its own add_header, because nginx drops the server's add_header lines in a location that sets any of its own.
#
# Content-Security-Policy, piece by piece:
#   script-src   the app's own files plus the one inline script (index.html: applies the saved theme before the first
#                paint), allowed by its hash. Changing that script changes the hash: `npm run build` checks it
#                (scripts/check-csp.mjs) and prints the new value for this file and public/web.config.
#   style-src    'unsafe-inline' for React style attributes and the website loader's <style>
#   font-src     the self-hosted Inter and Poppins files (src/shared/assets/fonts.ts)
#   connect-src  the API and its live-notification hub (https + wss), and the Indian pincode lookup.
#                CHANGE https://qa.feedxchange.in / wss://qa.feedxchange.in to the API this site's build uses (VITE_API_URL);
#                'self' already covers an API served under /api on this domain.
#   img-src      https: because business documents and banners can come from the API or a file store
#   frame-ancestors 'none'  nobody may frame the site (clickjacking); X-Frame-Options says the same to older browsers
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-LR8z5VEtDGNWz9nvBh3F8FwLtjSGe7JKE1UE5U/S5eA='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://qa.feedxchange.in wss://qa.feedxchange.in https://api.postalpincode.in; worker-src 'self'; manifest-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# the app writes to the clipboard (copy contract number) and asks for notification permission; nothing else
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
