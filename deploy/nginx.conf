# One domain, website and admin app. Build with `npm run build`, copy dist/ to /var/www/feedxchange, include this server block.
#
#   /                      -> index.html     (prerendered home page)
#   /about, /products/doc  -> about.html, products/doc.html   (prerendered website pages)
#   /admin/**, unknown     -> app.html       (the app shell; React Router takes over)
#   /api/**                -> the .NET API
#
# Security headers: copy deploy/security-headers.conf to /etc/nginx/snippets/feedxchange-security-headers.conf. It is
# included in the server block and in every location with its own add_header (nginx would drop the server's otherwise).

server {
    listen 443 ssl http2;
    server_name feedxchange.in www.feedxchange.in;

    root /var/www/feedxchange;
    index index.html;

    include /etc/nginx/snippets/feedxchange-security-headers.conf;

    # Compress text responses: the CSS and JavaScript the website loads first shrink from about 1.4 MB to under 400 KB.
    # (With the ngx_brotli module installed, add the matching brotli on / brotli_types lines for a further ~15%.)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript application/json
               application/ld+json image/svg+xml font/ttf application/manifest+json;

    # the API (adjust the upstream to where it listens)
    location /api/ {
        proxy_pass http://127.0.0.1:5038;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # product, category and blog pictures uploaded in the admin app are stored by the API (served at /images)
    location /images/ {
        proxy_pass http://127.0.0.1:5038;
        proxy_set_header Host $host;
        expires 7d;
    }

    # live notifications (SignalR)
    location /hubs/ {
        proxy_pass http://127.0.0.1:5038;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # pictures and icons in the site root: a day in the browser cache
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri =404;
    }

    # agent / security manifests: a missing one is a real 404, never the website page (that would read as an invalid manifest)
    location /.well-known/ {
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri =404;
    }

    # hashed files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri =404;
    }

    # the signed-in app: the shell, never indexed
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files /app.html =404;
    }

    # website pages: a prerendered file when there is one, otherwise the app shell
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri $uri.html $uri/index.html /app.html;
    }
}
