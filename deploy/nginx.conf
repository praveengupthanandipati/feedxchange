# One domain, website and admin app. Build with `npm run build`, copy dist/ to /var/www/feedxchange, include this server block.
#
#   /                      -> index.html     (prerendered home page)
#   /about, /products/doc  -> about.html, products/doc.html   (prerendered website pages)
#   /admin/**, unknown     -> app.html       (the app shell; React Router takes over)
#   /api/**                -> the .NET API
#
# Security headers: copy deploy/security-headers.conf to /etc/nginx/snippets/feedxchange-security-headers.conf. It is
# included in the server block and in every location with its own add_header (nginx would drop the server's otherwise).

server {
    listen 443 ssl http2;
    server_name feedxchange.in www.feedxchange.in;

    root /var/www/feedxchange;
    index index.html;

    include /etc/nginx/snippets/feedxchange-security-headers.conf;

    # the API (adjust the upstream to where it listens)
    location /api/ {
        proxy_pass http://127.0.0.1:5038;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # live notifications (SignalR)
    location /hubs/ {
        proxy_pass http://127.0.0.1:5038;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # hashed files never change
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri =404;
    }

    # the signed-in app: the shell, never indexed
    location /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files /app.html =404;
    }

    # website pages: a prerendered file when there is one, otherwise the app shell
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/feedxchange-security-headers.conf;
        try_files $uri $uri.html $uri/index.html /app.html;
    }
}
