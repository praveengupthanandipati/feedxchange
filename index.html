<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Defaults for any page; each website page sets its own (src/features/website/seo/useSeo.ts) and the prerender saves them. -->
    <meta name="description" content="feedXchange: India's B2B marketplace for animal feed ingredients. Buy and sell de-oiled cakes, soybean meal, DDGS, rice bran and maize with live prices and verified sellers." />
    <meta name="theme-color" content="#1b3664" />
    <meta name="application-name" content="feedXchange" />
    <meta name="geo.region" content="IN-AP" />
    <meta name="geo.placename" content="Vijayawada, Andhra Pradesh, India" />
    <meta property="og:site_name" content="feedXchange" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="https://feedxchange.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_API_URL%" />
    <!-- Applies the saved theme before the first paint (no flash of the wrong colours). Same rules as src/shared/theme/theme.ts. -->
    <script>
      (function () {
        var choice = "light";
        try { choice = localStorage.getItem("fx-theme") || "light"; } catch (e) {}
        if (["light", "dark", "high-contrast", "system"].indexOf(choice) < 0) choice = "light";
        var media = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
        var theme = choice !== "system" ? choice : media("(prefers-contrast: more)") ? "high-contrast" : media("(prefers-color-scheme: dark)") ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-choice", choice);
        // the admin app is more compact than the website (tokens.scss)
        root.setAttribute("data-app", location.pathname.indexOf("/admin") === 0 ? "admin" : "site");
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", theme === "dark" ? "dark" : "light");
      })();
    </script>
    <title>feedXchange | B2B Animal Feed Ingredients Marketplace India</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
