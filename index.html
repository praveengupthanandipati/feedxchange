<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <!-- Applies the saved theme before the first paint (no flash of the wrong colours). Same rules as src/shared/theme/theme.ts. -->
    <script>
      (function () {
        var choice = "light";
        try { choice = localStorage.getItem("fx-theme") || "light"; } catch (e) {}
        if (["light", "dark", "high-contrast", "system"].indexOf(choice) < 0) choice = "light";
        var media = function (q) { return !!(window.matchMedia && window.matchMedia(q).matches); };
        var theme = choice !== "system" ? choice : media("(prefers-contrast: more)") ? "high-contrast" : media("(prefers-color-scheme: dark)") ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.setAttribute("data-theme-choice", choice);
        // the admin app is more compact than the website (tokens.scss)
        root.setAttribute("data-app", location.pathname.indexOf("/admin") === 0 ? "admin" : "site");
        document.querySelector('meta[name="color-scheme"]').setAttribute("content", theme === "dark" ? "dark" : "light");
      })();
    </script>
    <title>feedxchange</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
